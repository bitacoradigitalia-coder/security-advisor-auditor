# Configuración mypy — FASE 3 (tipado estricto, issue #1)
# Empezar por scripts/core y extender progresivamente al resto de scripts/
[mypy]
python_version = 3.10
files = scripts/core
strict = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Dependencias externas sin stubs
[mypy-requests.*]
ignore_missing_imports = True
