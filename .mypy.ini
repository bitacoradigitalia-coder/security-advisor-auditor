# Configuración mypy — FASE 3 (issue #1)
# Gate pragmático: empezar no-estricto y endurecer gradualmente
# (el objetivo es CI verde desde el primer dia; strict = True es la meta)
[mypy]
python_version = 3.10
files = scripts/core
ignore_missing_imports = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = False
no_implicit_optional = True

# Meta: reactivar cuando scripts/core este 100% anotado
# strict = True
