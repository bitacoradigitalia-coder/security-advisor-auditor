name: Security Audit

# Security Advisor Auditor v2.2 - GitHub Actions Workflow
# Static audit of this repository on push/PR/schedule; active scanning ONLY on manual dispatch.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target URL or path to scan (active mode only)'
        required: false
        default: ''
      mode:
        description: 'Scan mode (QUICK, STANDARD, DEEP, ACTIVE)'
        required: false
        default: 'STANDARD'
      active:
        description: 'Enable active scanning'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run static analysis
      id: static-analysis
      continue-on-error: true
      run: |
        mkdir -p reports/static-analysis
        python scripts/audit.py scan . \
          --output reports/static-analysis \
          --mode DEEP \
          --max-file-bytes 2000000 \
          --max-files 20000 \
          --max-total-bytes 50000000 \
          --max-seconds 120

    - name: Upload static analysis results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: static-analysis-results
        path: reports/static-analysis/
        if-no-files-found: ignore
        retention-days: 30

    - name: Display summary
      if: always()
      run: |
        echo "Static analysis completed"
        if [ -f reports/static-analysis/audit.json ]; then
          echo "Findings: $(jq '.findings | length' reports/static-analysis/audit.json)"
        else
          echo "No audit.json generated"
        fi

  active-scanning:
    name: Active Scanning
    needs: static-analysis
    runs-on: ubuntu-latest
    # SECURITY: active scanning only with explicit manual dispatch and opt-in
    if: github.event_name == 'workflow_dispatch' && inputs.active == 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Nuclei
      continue-on-error: true
      run: |
        wget https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_$(uname -m)_linux -O nuclei
        chmod +x nuclei
        sudo mv nuclei /usr/local/bin/nuclei
        nuclei -version

    - name: Run active scan
      continue-on-error: true
      env:
        SCAN_TARGET: ${{ inputs.target }}
        SCAN_MODE: ${{ inputs.mode }}
      run: |
        mkdir -p reports/active-scan
        if [ -z "$SCAN_TARGET" ]; then
          echo "No target provided; skipping active scan"
          exit 0
        fi
        python scripts/audit.py scan "$SCAN_TARGET" \
          --output reports/active-scan \
          --active \
          --nuclei \
          --mode "${SCAN_MODE:-STANDARD}" \
          --max-file-bytes 2000000

    - name: Upload active scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: active-scan-results
        path: reports/active-scan/
        if-no-files-found: ignore
        retention-days: 7

  generate-report:
    name: Generate Report
    needs: [static-analysis]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download static analysis results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: static-analysis-results
        path: reports/static-analysis/

    - name: Generate reports
      continue-on-error: true
      run: |
        mkdir -p reports/final
        if [ -f reports/static-analysis/audit.json ]; then
          python scripts/audit.py report reports/static-analysis/audit.json --output reports/final/report.md --format markdown || true
          python scripts/audit.py report reports/static-analysis/audit.json --output reports/final/report.html --format html || true
          python scripts/audit.py report reports/static-analysis/audit.json --output reports/final/report.json --format json || true
        else
          echo "No audit.json available; skipping report generation"
        fi

    - name: Upload final report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-report
        path: reports/final/
        if-no-files-found: ignore
        retention-days: 90

    - name: Job summary
      if: always()
      run: |
        echo "## Security Audit" >> "$GITHUB_STEP_SUMMARY"
        if [ -f reports/final/report.json ]; then
          echo "Findings: $(jq '.findings | length' reports/final/report.json)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No report generated (scan may have failed; check artifacts)" >> "$GITHUB_STEP_SUMMARY"
        fi