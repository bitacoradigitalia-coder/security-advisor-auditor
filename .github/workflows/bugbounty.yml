name: Bug Bounty Management

# Bug Bounty workflow for Security Advisor Auditor v2.2
# Manual only (workflow_dispatch). All actions are tolerant to failures.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
        - list-programs
        - add-program
        - list-findings
        - generate-report
        - submit-report
      program_name:
        description: 'Name of the Bug Bounty program'
        required: false
        default: ''
      program_scope:
        description: 'Scope of the program (comma-separated domains)'
        required: false
        default: ''
      program_platform:
        description: 'Platform (hackerone, bugcrowd, intigriti)'
        required: false
        default: 'hackerone'
        type: choice
        options:
        - hackerone
        - bugcrowd
        - intigriti
        - other
      program_handle:
        description: 'Program handle on the platform'
        required: false
        default: ''
      finding_id:
        description: 'ID of the finding to manage'
        required: false
        default: ''
      report_format:
        description: 'Report format (markdown, html, json)'
        required: false
        default: 'markdown'
        type: choice
        options:
        - markdown
        - html
        - json
      platform_token:
        description: 'API token for the platform (secret)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bugbounty-management:
    name: Bug Bounty Management
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Perform action
      continue-on-error: true
      env:
        ACTION: ${{ inputs.action }}
        PROGRAM_NAME: ${{ inputs.program_name }}
        PROGRAM_SCOPE: ${{ inputs.program_scope }}
        PROGRAM_PLATFORM: ${{ inputs.program_platform }}
        PROGRAM_HANDLE: ${{ inputs.program_handle }}
        FINDING_ID: ${{ inputs.finding_id }}
        REPORT_FORMAT: ${{ inputs.report_format }}
      run: |
        mkdir -p reports/bugbounty
        python scripts/bugbounty/ci_actions.py

    - name: Upload Bug Bounty reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bugbounty-reports
        path: reports/bugbounty/
        if-no-files-found: ignore
        retention-days: 30

    - name: Job summary
      if: always()
      run: |
        echo "## Bug Bounty Management" >> "$GITHUB_STEP_SUMMARY"
        echo "Action performed: ${{ inputs.action }}" >> "$GITHUB_STEP_SUMMARY"