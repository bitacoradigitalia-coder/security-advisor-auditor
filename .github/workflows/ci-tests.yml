name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Parches de reglas
        run: |
          set +e
          python .github/fix_rules_v4.py > patch.log 2>&1
          cat patch.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "mejora 4: corregir patron JS006 (corchete escapado)"
          git push origin main 2>> patch.log || echo "push fallido" >> patch.log
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest mypy
      - name: Tests
        run: |
          set +e
          python -m pytest tests/ -q > pytest.log 2>&1
          pcode=$?
          python .github/bench_debug.py >> pytest.log 2>&1 || true
          echo "PYTEST_EXIT=$pcode"
          tail -40 pytest.log
          test $pcode -eq 0
      - name: Subir log a rama ci-diag
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diag
          git add -f pytest.log patch.log 2>/dev/null || true
          git commit -m "diag: logs CI" || true
          git push -f origin ci-diag || true
