name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest mypy
      - name: Tests
        run: |
          set +e
          python -m pytest tests/ -q > pytest.log 2>&1
          pcode=$?
          python .github/bench_debug.py >> pytest.log 2>&1 || true
          echo "PYTEST_EXIT=$pcode"
          tail -40 pytest.log
          test $pcode -eq 0
      - name: Subir log a rama ci-diag
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diag
          git add -f pytest.log || true
          git commit -m "diag: log CI" || true
          git push -f origin ci-diag || true
