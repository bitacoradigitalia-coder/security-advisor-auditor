name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest mypy
      - name: Tests
        run: python -m pytest tests/ -q 2>&1 | tee pytest.log
      - name: Mypy
        run: mypy --config-file mypy.ini 2>&1 | tee -a pytest.log
      - name: Subir log
        if: always()
        run: |
          git config --global user.name "ci-diag"
          git config --global user.email "ci@diag"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bitacoradigitalia-coder/security-advisor-auditor.git
          git fetch origin ci-diag || git switch -c ci-diag
          git switch ci-diag || true
          mkdir -p logs
          cp pytest.log logs/pytest-run-${{ github.run_id }}.txt
          git add logs
          git commit -m "diag run ${{ github.run_id }}"
          git push origin ci-diag
