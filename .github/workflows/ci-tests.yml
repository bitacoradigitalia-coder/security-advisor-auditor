name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest mypy
      - name: Tests
        run: |
          python -m pytest tests/ -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=$status" >> pytest.log
          exit $status
      - name: Diagnostico: subir pytest.log a rama ci-diag
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-diag || true
          git checkout -B ci-diag origin/ci-diag || git checkout -B ci-diag
          mkdir -p logs
          cp pytest.log "logs/pytest-run-${{ github.run_id }}.txt" || true
          git add -A
          git commit -m "diag: log pytest run ${{ github.run_id }}" || true
          git push origin ci-diag || true
      - name: Mypy (advisory, no bloqueante)
        if: always()
        run: mypy --config-file mypy.ini || true