name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest mypy
      - name: Tests
        run: python -m pytest tests/ -q 2>&1 | tee pytest.log
      - name: Mypy
        run: mypy --config-file mypy.ini 2>&1 | tee -a pytest.log
      - name: Diagnostico
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: bitacoradigitalia-coder/security-advisor-auditor
          RUN_ID: ${{ github.run_id }}
        run: |
          B64=$(base64 -w0 pytest.log)
          printf '{"message":"diag","content":"%s","branch":"ci-diag"}' "$B64" > payload.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/$REPO/contents/logs/pytest-run-$RUN_ID.txt -d @payload.json
