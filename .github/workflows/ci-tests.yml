name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest mypy
      - name: Tests
        run: python -m pytest tests/ -q 2>&1 | tee pytest.log
      - name: Mypy
        run: mypy --config-file mypy.ini 2>&1 | tee -a pytest.log
      - name: Subir log via API
        if: always()
        run: |
          B64=$(base64 -w0 pytest.log)
          RUNID=${{ github.run_id }}
          printf '{"message":"diag run %s","content":"%s","branch":"ci-diag"}' "$RUNID" "$B64" > payload.json
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d @payload.json https://api.github.com/repos/bitacoradigitalia-coder/security-advisor-auditor/contents/logs/pytest-run-$RUNID.txt
